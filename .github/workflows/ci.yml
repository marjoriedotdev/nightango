name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      # Every user is told about a release from main: a beta must not reach it, even through a pull request.
      - name: Refuse a beta @version on main
        if: (github.base_ref || github.ref_name) == 'main'
        run: |
          if grep -Eq '^// @version[[:space:]]+[^[:space:]]*-' src/loader/skin-loader.js; then
            echo "::error::main publishes stable releases only: set @version to X.Y.Z in src/loader/skin-loader.js."
            exit 1
          fi
      - run: pnpm test

  release:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # One release per @version: a push without a version bump publishes nothing.
      # The beta branch publishes prereleases only, which releases/latest skips (update check, ADR-0013).
      - name: Create release for @version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's|^// @version[[:space:]]*||p' src/loader/skin-loader.js)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::Invalid @version '$version' in src/loader/skin-loader.js"
            exit 1
          fi
          flags=
          case "$GITHUB_REF_NAME/$version" in
            beta/*-beta.*) flags='--prerelease --latest=false' ;;
            beta/*) echo "@version $version is not a beta, nothing to publish from beta."; exit 0 ;;
          esac
          tag="v$version"
          if gh release view "$tag" > /dev/null 2> view.err; then
            echo "Release $tag already exists, nothing to publish."
            exit 0
          fi
          if ! grep -q 'release not found' view.err; then
            cat view.err
            exit 1
          fi
          gh release create "$tag" dist/nightango.min.user.js dist/nightango.user.js --target "$GITHUB_SHA" --title "$tag" --generate-notes $flags
