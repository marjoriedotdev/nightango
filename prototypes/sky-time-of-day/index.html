<!doctype html>
<!-- PROTOTYPE, throwaway (issue #86): sky stages by local hour, shown on the real hosted prototype at 1440 and 390 px. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky by hour, prototype</title>
<style>
  :root { color-scheme: dark; --ui-bg: #0b0e16; --ui-panel: #151a26; --ui-border: #2a3142; --ui-text: #e8ebf2; --ui-muted: #9aa3b8; --ui-accent: #f27a3f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font: 13px/1.4 system-ui, sans-serif; }
  .stage { display: flex; gap: 16px; align-items: flex-start; padding: 16px 16px 150px; }
  .frame { flex: none; position: relative; overflow: hidden; border: 1px solid var(--ui-border); border-radius: 8px; background: #000; }
  .frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
  .frame-label { margin: 0 0 6px; color: var(--ui-muted); font-size: 12px; }
  .bar { position: fixed; left: 16px; right: 16px; bottom: 16px; display: grid; gap: 10px; padding: 12px 14px; background: var(--ui-panel); border: 1px solid var(--ui-border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row b { min-width: 64px; color: var(--ui-muted); font-weight: 600; }
  .seg button { padding: 5px 10px; border: 1px solid var(--ui-border); border-radius: 6px; background: transparent; color: var(--ui-text); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ui-accent); border-color: var(--ui-accent); color: #0f1012; }
  input[type=range] { flex: 1; min-width: 200px; accent-color: var(--ui-accent); }
  .hour { width: 52px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .readout { font: 12px/1.5 ui-monospace, monospace; color: var(--ui-muted); }
  .readout span { color: var(--ui-text); }
  .swatch { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 2px; border-radius: 2px; vertical-align: -1px; border: 1px solid rgba(255,255,255,.25); }
  .bad { color: #f29a9a !important; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div><p class="frame-label">1440 x 900</p><div class="frame" id="wide"><iframe title="Desktop" src="/dist/nightango.html" width="1440" height="900"></iframe></div></div>
  <div><p class="frame-label">390 x 844, drawer open</p><div class="frame" id="narrow"><iframe title="Mobile" src="/dist/nightango.html" width="390" height="844"></iframe></div></div>
</div>

<div class="bar">
  <div class="row"><b>Theme</b><span class="seg" id="themes"></span><b style="margin-left:16px">Stage</b><span class="seg" id="stages"></span><label style="margin-left:16px"><input type="checkbox" id="calm"> Calm sky (today's fixed sky)</label></div>
  <div class="row"><b>Hour</b><span class="hour" id="hourLabel"></span><input type="range" id="hour" min="0" max="24" step="0.25"><span class="seg"><button id="play" aria-pressed="false">Play a day in 24 s</button></span></div>
  <div class="row readout" id="readout"></div>
</div>

<script>
// -- Stages ---------------------------------------------------------------
// night and morning are today's sky: Calm sky and the hours outside a theme's range fall back on them.
var STAGES = {
  dark: {
    dusk:  { label: 'Dusk',  top: '#1c1f4b', bottom: '#3b1f30', star: 'rgba(255,255,255,0.5)',  cloud: 'rgba(242,150,110,0.16)' },
    night: { label: 'Night', top: '#0f1b3a', bottom: '#060a15', star: 'rgba(255,255,255,0.85)', cloud: 'rgba(168,186,226,0.16)' },
    dawn:  { label: 'Dawn',  top: '#132247', bottom: '#352943', star: 'rgba(255,255,255,0.4)',  cloud: 'rgba(232,182,200,0.16)' }
  },
  light: {
    morning: { label: 'Morning',     top: '#dfe1f3', bottom: '#f6efe6', star: 'rgba(87,91,112,0.28)', cloud: 'rgba(255,255,255,0.85)' },
    day:     { label: 'Day',         top: '#cfe1f6', bottom: '#f4f7fb', star: 'rgba(87,91,112,0)',    cloud: 'rgba(255,255,255,0.95)' },
    golden:  { label: 'Golden hour', top: '#efd5e2', bottom: '#fbdcae', star: 'rgba(150,90,60,0.16)', cloud: 'rgba(255,240,222,0.85)' }
  }
};
// Keyframes [hour, stage]: the sky holds a stage between two equal keyframes and blends between different ones.
var KEYS = {
  dark:  [[0, 'night'], [4, 'night'], [5.5, 'dawn'], [7.5, 'night'], [17, 'night'], [19.5, 'dusk'], [22.5, 'night'], [24, 'night']],
  light: [[0, 'morning'], [8, 'morning'], [12, 'day'], [16, 'day'], [19, 'golden'], [21.5, 'morning'], [24, 'morning']]
};
var REST = { dark: 'night', light: 'morning' };
var CENTER = { dusk: 19.5, night: 1, dawn: 5.5, morning: 8, day: 14, golden: 19 };

// -- Color math -----------------------------------------------------------
function parse(c) {
  if (c[0] === '#') return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16), 1];
  var m = c.match(/[\d.]+/g).map(Number); return [m[0], m[1], m[2], m[3] == null ? 1 : m[3]];
}
function mix(a, b, t) { var p = parse(a), q = parse(b); return 'rgba(' + [0, 1, 2].map(function (i) { return Math.round(p[i] + (q[i] - p[i]) * t); }).join(',') + ',' + (p[3] + (q[3] - p[3]) * t).toFixed(3) + ')'; }
function hex(c) { var p = parse(c); return '#' + p.slice(0, 3).map(function (v) { return Math.round(v).toString(16).padStart(2, '0'); }).join(''); }
function lum(c) { var p = parse(c); return p.slice(0, 3).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }).reduce(function (s, v, i) { return s + v * [0.2126, 0.7152, 0.0722][i]; }, 0); }
function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function smooth(t) { return t * t * (3 - 2 * t); }

function skyAt(theme, hour) {
  var keys = KEYS[theme];
  for (var i = 0; i < keys.length - 1; i++) {
    if (hour >= keys[i][0] && hour <= keys[i + 1][0]) {
      var a = STAGES[theme][keys[i][1]], b = STAGES[theme][keys[i + 1][1]];
      var t = smooth((hour - keys[i][0]) / (keys[i + 1][0] - keys[i][0]));
      return { top: mix(a.top, b.top, t), bottom: mix(a.bottom, b.bottom, t), star: mix(a.star, b.star, t), cloud: mix(a.cloud, b.cloud, t), from: keys[i][1], to: keys[i + 1][1], t: t };
    }
  }
}

// -- State and frames -----------------------------------------------------
var state = { theme: 'dark', hour: 19.5, calm: false, playing: null };
var tokens = null;
var frames = [document.querySelector('#wide iframe'), document.querySelector('#narrow iframe')];

function fit() {
  var avail = window.innerWidth - 32 - 16 - 2;
  var s = Math.min(1, avail / (1440 + 390));
  [['wide', 1440, 900], ['narrow', 390, 844]].forEach(function (f) {
    var box = document.getElementById(f[0]);
    box.style.width = f[1] * s + 'px'; box.style.height = f[2] * s + 'px';
    box.querySelector('iframe').style.transform = 'scale(' + s + ')';
  });
}

function apply() {
  var sky = state.calm ? STAGES[state.theme][REST[state.theme]] : skyAt(state.theme, state.hour);
  frames.forEach(function (f) {
    var d = f.contentDocument; if (!d || !d.documentElement) return;
    var r = d.documentElement;
    r.setAttribute('data-theme', state.theme);
    r.classList.toggle('calm-sky', state.calm);
    r.style.setProperty('--sky-top', sky.top); r.style.setProperty('--sky-bottom', sky.bottom);
    r.style.setProperty('--star', sky.star); r.style.setProperty('--cloud', sky.cloud);
  });
  render(sky);
}

function render(sky) {
  var h = Math.floor(state.hour), m = Math.round((state.hour - h) * 60);
  document.getElementById('hourLabel').textContent = String(h % 24).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  document.getElementById('hour').value = state.hour;
  document.getElementById('calm').checked = state.calm;
  seg('themes', [['dark', 'Dark'], ['light', 'Light']], state.theme, function (v) { state.theme = v; state.hour = CENTER[Object.keys(STAGES[v])[v === 'dark' ? 0 : 1]]; apply(); });
  var near = state.calm ? null : (sky.t < 0.5 ? sky.from : sky.to);
  seg('stages', Object.keys(STAGES[state.theme]).map(function (k) { return [k, STAGES[state.theme][k].label]; }), near, function (v) { state.calm = false; state.hour = CENTER[v]; apply(); });
  var out = '';
  if (tokens) {
    var text = tokens.text[state.theme], bg = tokens.bg[state.theme];
    var topbar = mix(bg, sky.top, 0.55);
    var c1 = contrast(text, hex(sky.top)), c2 = contrast(text, hex(topbar));
    out += 'text on brand sky-top <span class="' + (c1 < 4.5 ? 'bad' : '') + '">' + c1.toFixed(1) + ':1</span> &nbsp; text on topbar <span class="' + (c2 < 4.5 ? 'bad' : '') + '">' + c2.toFixed(1) + ':1</span> &nbsp; ';
  }
  out += 'sky-top <i class="swatch" style="background:' + sky.top + '"></i><span>' + hex(sky.top) + '</span> &nbsp; sky-bottom <i class="swatch" style="background:' + sky.bottom + '"></i><span>' + hex(sky.bottom) + '</span>';
  out += state.calm ? ' &nbsp; <span>Calm sky: fixed</span>' : ' &nbsp; blend <span>' + STAGES[state.theme][sky.from].label + ' to ' + STAGES[state.theme][sky.to].label + ' ' + Math.round(sky.t * 100) + '%</span>';
  document.getElementById('readout').innerHTML = out;
}

function seg(id, items, current, onPick) {
  var el = document.getElementById(id); el.textContent = '';
  items.forEach(function (it) {
    var b = document.createElement('button'); b.textContent = it[1]; b.setAttribute('aria-pressed', String(it[0] === current));
    b.onclick = function () { onPick(it[0]); }; el.appendChild(b);
  });
}

// Signs in to the simulated prototype with a placeholder password, then opens the drawer on the narrow frame.
function boot(f, openDrawer) {
  var tries = 0;
  (function step() {
    var d = f.contentDocument, pw = d && d.querySelector('input[type=password]');
    if (pw) {
      Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(pw, 'prototype');
      pw.dispatchEvent(new Event('input', { bubbles: true }));
      d.querySelector('button[type=submit]').click();
    }
    var menu = d && d.querySelector('button[aria-label="Open navigation"]');
    if (d && d.querySelector('.shell')) { if (openDrawer && menu) menu.click(); apply(); return; }
    if (++tries < 100) setTimeout(step, 150);
  })();
}

document.getElementById('hour').oninput = function (e) { state.hour = Number(e.target.value); state.calm = false; apply(); };
document.getElementById('calm').onchange = function (e) { state.calm = e.target.checked; apply(); };
document.getElementById('play').onclick = function (e) {
  if (state.playing) { clearInterval(state.playing); state.playing = null; e.target.setAttribute('aria-pressed', 'false'); return; }
  state.calm = false; e.target.setAttribute('aria-pressed', 'true');
  state.playing = setInterval(function () { state.hour = (state.hour + 0.1) % 24; apply(); }, 100);
};
window.onresize = fit;
fit();
frames[0].onload = function () { boot(frames[0], false); };
frames[1].onload = function () { boot(frames[1], true); };
fetch('/torchds/project/tokens.json').then(function (r) { return r.json(); }).then(function (j) {
  tokens = {}; j.color.tokens.forEach(function (t) { tokens[t.name] = t.value; }); apply();
});
apply();
</script>
</body>
</html>
